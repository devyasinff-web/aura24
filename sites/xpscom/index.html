<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Shakib1k · 3D Download Panel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0b0d10;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            padding: 20px;
            margin: 0;
            perspective: 1200px;
            overflow-x: hidden;
        }

        /* ====== PARTICLE BACKGROUND ====== */
        .particles {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: radial-gradient(circle, rgba(100, 200, 255, 0.4), transparent);
            border-radius: 50%;
            animation: particleFloat linear infinite;
        }

        @keyframes particleFloat {
            0% { transform: translateY(100vh) rotate(0deg) scale(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-10vh) rotate(720deg) scale(1); opacity: 0; }
        }

        /* ====== ORB BACKGROUND ====== */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: 
                radial-gradient(circle at 20% 50%, rgba(100, 200, 255, 0.03), transparent 60%),
                radial-gradient(circle at 80% 50%, rgba(255, 100, 150, 0.03), transparent 60%);
            pointer-events: none;
            z-index: 0;
        }

        .bg-layer {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            opacity: 0;
            transition: opacity 1.5s ease;
        }
        .bg-layer.active { opacity: 1; }

        .bg-layer-1 {
            background: 
                radial-gradient(circle at 30% 40%, rgba(100, 200, 255, 0.05), transparent 50%),
                radial-gradient(circle at 70% 60%, rgba(200, 100, 255, 0.03), transparent 50%);
            animation: ringPulse 3s ease-in-out infinite alternate;
        }
        @keyframes ringPulse {
            0% { transform: scale(1); opacity: 0.5; }
            100% { transform: scale(1.1); opacity: 1; }
        }

        .bg-layer-2 {
            background: 
                repeating-linear-gradient(45deg, transparent, transparent 40px, rgba(100, 200, 255, 0.01) 40px, rgba(100, 200, 255, 0.01) 41px),
                repeating-linear-gradient(-45deg, transparent, transparent 40px, rgba(255, 100, 200, 0.01) 40px, rgba(255, 100, 200, 0.01) 41px);
            animation: waveMove 4s linear infinite;
        }
        @keyframes waveMove {
            0% { transform: translateX(0) translateY(0); }
            100% { transform: translateX(40px) translateY(20px); }
        }

        .bg-layer-3 .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.15;
            animation: orbFloat 5s ease-in-out infinite alternate;
        }
        .bg-layer-3 .orb-1 { width: 300px; height: 300px; background: rgba(100, 200, 255, 0.1); top: -50px; left: -50px; animation-delay: 0s; }
        .bg-layer-3 .orb-2 { width: 400px; height: 400px; background: rgba(255, 100, 150, 0.08); bottom: -100px; right: -100px; animation-delay: 2s; }
        .bg-layer-3 .orb-3 { width: 200px; height: 200px; background: rgba(200, 200, 100, 0.06); top: 50%; left: 50%; transform: translate(-50%, -50%); animation-delay: 4s; }
        @keyframes orbFloat {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, -30px) scale(1.2); }
        }

        /* ====== MAIN GLASS PANEL ====== */
        .glass-panel {
            max-width: 880px;
            width: 100%;
            background: rgba(14, 18, 26, 0.78);
            backdrop-filter: blur(16px) saturate(190%);
            -webkit-backdrop-filter: blur(16px) saturate(190%);
            border-radius: 48px;
            padding: 32px 28px 38px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(255, 255, 255, 0.02), 0 0 60px rgba(100, 150, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.02);
            transform-style: preserve-3d;
            animation: panelEntrance 1s cubic-bezier(0.15, 0.85, 0.35, 1.1) forwards,
                       float3D 8s ease-in-out infinite alternate 1.2s;
            position: relative;
            z-index: 1;
            opacity: 0;
            transform: translateY(60px) rotateX(10deg) scale(0.9);
        }

        @keyframes panelEntrance {
            0% { opacity: 0; transform: translateY(60px) rotateX(10deg) scale(0.9) rotateY(-10deg); }
            60% { opacity: 1; transform: translateY(-8px) rotateX(2deg) scale(1.01) rotateY(2deg); }
            80% { transform: translateY(4px) rotateX(-1deg) scale(0.99) rotateY(-1deg); }
            100% { opacity: 1; transform: translateY(0) rotateX(0deg) scale(1) rotateY(0deg); }
        }

        @keyframes float3D {
            0% { transform: translateY(0px) rotateX(2deg) rotateY(-3deg) scale(1); }
            25% { transform: translateY(-8px) rotateX(3deg) rotateY(-1deg) scale(1.01); }
            50% { transform: translateY(-4px) rotateX(1deg) rotateY(4deg) scale(1); }
            75% { transform: translateY(-10px) rotateX(-2deg) rotateY(2deg) scale(1.01); }
            100% { transform: translateY(-6px) rotateX(0deg) rotateY(-4deg) scale(1); }
        }

        /* ====== GLOW BORDER ====== */
        .glass-panel::before {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: 48px;
            padding: 1px;
            background: linear-gradient(135deg, rgba(100, 200, 255, 0.1), transparent 40%, transparent 60%, rgba(255, 100, 150, 0.1));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            animation: borderGlow 4s ease-in-out infinite alternate;
        }

        @keyframes borderGlow {
            0% { opacity: 0.3; }
            50% { opacity: 0.8; }
            100% { opacity: 0.3; }
        }

        /* ====== HEADER ====== */
        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 28px;
            flex-wrap: wrap;
            gap: 12px 8px;
            transform: translateZ(30px);
            animation: headerFloat 6s ease-in-out infinite alternate 1.2s;
        }

        @keyframes headerFloat {
            0% { transform: translateZ(30px) translateY(0); }
            100% { transform: translateZ(50px) translateY(-3px); }
        }

        .panel-header h1 {
            font-weight: 550;
            font-size: 2.1rem;
            letter-spacing: -0.4px;
            background: linear-gradient(145deg, #eaf1ff, #b4ccff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            display: flex;
            align-items: center;
            gap: 12px;
            font-family: 'Inter', sans-serif;
            animation: textGlow 3s ease-in-out infinite alternate;
        }

        @keyframes textGlow {
            0% { filter: drop-shadow(0 0 20px rgba(100, 150, 255, 0.1)); }
            100% { filter: drop-shadow(0 0 50px rgba(100, 150, 255, 0.3)); }
        }

        .badge {
            background: rgba(255, 215, 0, 0.08);
            border: 1px solid rgba(255, 215, 0, 0.10);
            color: #f5d77d;
            font-size: 0.7rem;
            padding: 5px 18px;
            border-radius: 60px;
            letter-spacing: 0.4px;
            font-weight: 430;
            backdrop-filter: blur(4px);
            white-space: nowrap;
            transform: translateZ(20px);
            animation: badgePulse 2s ease-in-out infinite;
        }

        @keyframes badgePulse {
            0%, 100% { opacity: 0.8; transform: translateZ(20px) scale(1); }
            50% { opacity: 1; transform: translateZ(25px) scale(1.05); }
        }

        .bg-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 16px 6px 12px;
            border-radius: 40px;
            background: rgba(100, 200, 150, 0.04);
            border: 1px solid rgba(100, 200, 150, 0.06);
            font-size: 0.75rem;
            color: #8ea1c0;
            transform: translateZ(15px);
            transition: all 0.4s ease;
            cursor: pointer;
            animation: indicatorPulse 3s ease-in-out infinite alternate;
        }

        @keyframes indicatorPulse {
            0% { border-color: rgba(100, 200, 150, 0.06); box-shadow: 0 0 0 0 rgba(100, 200, 150, 0); }
            100% { border-color: rgba(100, 200, 150, 0.15); box-shadow: 0 0 30px rgba(100, 200, 150, 0.03); }
        }

        .bg-indicator.playing {
            border-color: rgba(100, 200, 150, 0.2);
            background: rgba(100, 200, 150, 0.08);
        }

        .bg-indicator .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4a5a72;
            transition: all 0.3s;
        }
        .bg-indicator .dot.active {
            background: #5dde9e;
            box-shadow: 0 0 20px rgba(93, 222, 158, 0.3);
            animation: dotPulse 1.5s ease-in-out infinite;
        }

        @keyframes dotPulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.4); opacity: 0.7; }
        }

        .bg-indicator .track-name {
            color: #bcd0ff;
            max-width: 120px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .music-visualizer {
            display: flex;
            align-items: center;
            gap: 2px;
            height: 20px;
            margin-left: 6px;
            opacity: 0;
            transition: opacity 0.6s ease;
        }
        .music-visualizer.active { opacity: 1; }
        .music-visualizer .bar {
            width: 3px;
            background: linear-gradient(to top, #5dde9e, #4a9eff);
            border-radius: 3px;
            transition: height 0.15s ease;
            height: 4px;
            transform-origin: bottom;
        }

        /* ====== GLOW LINE ====== */
        .glow-line {
            width: 80px;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(100, 200, 255, 0.3), transparent);
            margin: 6px 0 18px 0;
            border-radius: 4px;
            animation: glowLine 3s ease-in-out infinite alternate;
        }
        @keyframes glowLine {
            0% { width: 80px; opacity: 0.3; }
            100% { width: 160px; opacity: 1; }
        }

        /* ====== FILE GRID ====== */
        .download-grid {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-top: 4px;
            transform-style: preserve-3d;
        }

        /* ====== 3D FILE CARD ====== */
        .file-card {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(4px);
            border-radius: 34px;
            padding: 18px 24px 18px 22px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px 12px;
            border: 1px solid rgba(255, 255, 255, 0.025);
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
            transform-style: preserve-3d;
            transition: all 0.5s cubic-bezier(0.2, 0.9, 0.3, 1.2);
            animation: cardEntrance 0.9s cubic-bezier(0.15, 0.85, 0.35, 1.1) forwards;
            opacity: 0;
            transform: translateY(40px) rotateX(8deg) scale(0.95);
        }

        .file-card:nth-child(1) { animation-delay: 0.08s; }
        .file-card:nth-child(2) { animation-delay: 0.16s; }
        .file-card:nth-child(3) { animation-delay: 0.24s; }
        .file-card:nth-child(4) { animation-delay: 0.32s; }
        .file-card:nth-child(5) { animation-delay: 0.40s; }
        .file-card:nth-child(6) { animation-delay: 0.48s; }
        .file-card:nth-child(7) { animation-delay: 0.56s; }
        .file-card:nth-child(8) { animation-delay: 0.64s; }

        @keyframes cardEntrance {
            0% { opacity: 0; transform: translateY(50px) rotateX(12deg) scale(0.9) translateZ(-30px); }
            60% { opacity: 1; transform: translateY(-6px) rotateX(2deg) scale(1.02) translateZ(8px); }
            80% { transform: translateY(4px) rotateX(-1deg) scale(0.98); }
            100% { opacity: 1; transform: translateY(0) rotateX(0deg) scale(1) translateZ(0); }
        }

        .file-card::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 40%, rgba(255, 255, 255, 0.04) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.6s ease;
            pointer-events: none;
            transform: rotateX(20deg);
        }
        .file-card:hover::after { opacity: 1; }

        .file-card:hover {
            background: rgba(255, 255, 255, 0.055);
            border-color: rgba(255, 255, 255, 0.08);
            transform: translateY(-6px) rotateX(2deg) rotateY(3deg) scale(1.02) translateZ(15px);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 40px rgba(50, 120, 255, 0.06);
        }

        .file-card:active {
            transform: scale(0.95) rotateX(1deg) translateZ(-5px);
            transition-duration: 0.08s;
        }

        /* ====== FILE INFO ====== */
        .file-info {
            display: flex;
            align-items: center;
            gap: 18px;
            flex: 2 1 220px;
            min-width: 150px;
            transform: translateZ(15px);
        }

        /* ====== 3D THUMBNAIL WRAPPER ====== */
        .file-thumbnail-wrapper {
            width: 56px;
            height: 56px;
            flex-shrink: 0;
            perspective: 400px;
            transform-style: preserve-3d;
        }

        .file-thumbnail {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            object-fit: cover;
            background: #0f141d;
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: all 0.4s cubic-bezier(0.2, 0.9, 0.3, 1.2);
            transform-style: preserve-3d;
            animation: thumbnailSpin 10s ease-in-out infinite;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        @keyframes thumbnailSpin {
            0% { transform: rotateY(0deg) rotateX(0deg) scale(1); }
            20% { transform: rotateY(72deg) rotateX(4deg) scale(1.04); }
            40% { transform: rotateY(144deg) rotateX(-3deg) scale(1.02); }
            60% { transform: rotateY(216deg) rotateX(5deg) scale(1.05); }
            80% { transform: rotateY(288deg) rotateX(-4deg) scale(1.02); }
            100% { transform: rotateY(360deg) rotateX(0deg) scale(1); }
        }

        .file-card:hover .file-thumbnail {
            animation: thumbnailSpinHover 2s ease-in-out infinite;
            box-shadow: 0 8px 35px rgba(50, 120, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.12);
        }

        @keyframes thumbnailSpinHover {
            0% { transform: rotateY(0deg) rotateX(0deg) scale(1.05); }
            25% { transform: rotateY(90deg) rotateX(8deg) scale(1.12); }
            50% { transform: rotateY(180deg) rotateX(0deg) scale(1.05); }
            75% { transform: rotateY(270deg) rotateX(-8deg) scale(1.12); }
            100% { transform: rotateY(360deg) rotateX(0deg) scale(1.05); }
        }

        .file-icon {
            width: 50px;
            height: 50px;
            background: linear-gradient(145deg, #1e2836, #10161f);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.04), 0 4px 12px rgba(0, 0, 0, 0.4);
            color: #b6d0ff;
            flex-shrink: 0;
            transition: all 0.3s ease;
            transform: translateZ(10px);
        }

        .file-card:hover .file-icon {
            transform: translateZ(25px) scale(1.12) rotateY(-12deg);
            box-shadow: 0 8px 30px rgba(50, 120, 255, 0.25);
        }

        .file-name {
            color: #eef3fc;
            font-weight: 460;
            font-size: 1.02rem;
            word-break: break-word;
            line-height: 1.4;
            letter-spacing: 0.1px;
            font-family: 'Inter', sans-serif;
            transform: translateZ(5px);
            transition: transform 0.3s ease;
        }
        .file-card:hover .file-name { transform: translateZ(20px); }

        .file-size {
            font-size: 0.7rem;
            color: #6d7f9c;
            margin-left: 8px;
            font-weight: 350;
        }

        /* ====== DOWNLOAD BUTTON ====== */
        .download-btn {
            background: linear-gradient(145deg, #e22a2a, #aa0000);
            border: none;
            padding: 12px 32px;
            border-radius: 60px;
            font-weight: 620;
            font-size: 0.98rem;
            color: #fff;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            text-decoration: none;
            border: 1px solid rgba(255, 80, 80, 0.4);
            box-shadow: 0 6px 24px rgba(200, 0, 0, 0.5);
            letter-spacing: 0.4px;
            font-family: 'Inter', sans-serif;
            position: relative;
            overflow: visible;
            transform-style: preserve-3d;
            transition: all 0.3s cubic-bezier(0.15, 0.9, 0.25, 1.2);
            transform: translateZ(10px);
            animation: 
                btnPulse 1.2s ease-in-out infinite alternate,
                btnRotate3D 3s ease-in-out infinite alternate,
                btnGlow 2s ease-in-out infinite alternate,
                btnFloat 2.5s ease-in-out infinite alternate;
        }

        @keyframes btnPulse {
            0% { transform: translateZ(10px) scale(1); }
            100% { transform: translateZ(25px) scale(1.06); }
        }

        @keyframes btnRotate3D {
            0% { transform: translateZ(10px) rotateX(0deg) rotateY(0deg); }
            25% { transform: translateZ(15px) rotateX(5deg) rotateY(3deg); }
            50% { transform: translateZ(10px) rotateX(-3deg) rotateY(-5deg); }
            75% { transform: translateZ(20px) rotateX(4deg) rotateY(-2deg); }
            100% { transform: translateZ(12px) rotateX(-2deg) rotateY(4deg); }
        }

        @keyframes btnGlow {
            0% { box-shadow: 0 6px 24px rgba(200, 0, 0, 0.5), 0 0 20px rgba(255, 0, 0, 0.1); border-color: rgba(255, 80, 80, 0.4); }
            50% { box-shadow: 0 6px 50px rgba(255, 0, 0, 0.9), 0 0 80px rgba(255, 0, 0, 0.3); border-color: rgba(255, 80, 80, 0.9); }
            100% { box-shadow: 0 6px 24px rgba(200, 0, 0, 0.5), 0 0 30px rgba(255, 50, 50, 0.15); border-color: rgba(255, 80, 80, 0.4); }
        }

        @keyframes btnFloat {
            0% { transform: translateZ(10px) translateY(0px); }
            50% { transform: translateZ(20px) translateY(-8px); }
            100% { transform: translateZ(10px) translateY(0px); }
        }

        .download-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 60px;
            padding: 2px;
            background: linear-gradient(135deg, rgba(255, 150, 150, 0.5), rgba(255, 50, 50, 0.1));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            animation: borderGlowBtn 2s ease-in-out infinite alternate;
        }

        @keyframes borderGlowBtn {
            0% { opacity: 0.3; }
            100% { opacity: 1; }
        }

        .download-btn:hover {
            background: linear-gradient(145deg, #ff3333, #bb0000);
            transform: translateZ(30px) scale(1.08) rotateX(3deg) rotateY(5deg);
            box-shadow: 0 20px 60px rgba(255, 0, 0, 0.8), 0 0 100px rgba(255, 0, 0, 0.3);
            border-color: rgba(255, 100, 100, 0.9);
            animation-play-state: paused;
        }

        .download-btn:active {
            transform: scale(0.92) translateZ(-5px);
            transition-duration: 0.08s;
            animation-play-state: paused;
        }

        .download-btn svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: all 0.3s ease;
            filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.3));
        }

        .download-btn:hover svg {
            transform: translateY(3px) scale(1.15);
            filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.6));
        }

        .download-btn.downloading {
            pointer-events: none;
            animation: 
                btnPulse 0.6s ease-in-out infinite alternate,
                btnRotate3D 1.5s ease-in-out infinite alternate,
                btnGlow 0.8s ease-in-out infinite alternate,
                btnFloat 1s ease-in-out infinite alternate;
            opacity: 0.85;
        }

        .download-btn .spinner {
            display: none;
            width: 22px;
            height: 22px;
            border: 3px solid rgba(255,255,255,0.2);
            border-top: 3px solid #fff;
            border-radius: 50%;
            animation: spin3D 0.8s linear infinite;
            transform: translateZ(10px);
            filter: drop-shadow(0 0 10px rgba(255,255,255,0.3));
        }

        @keyframes spin3D {
            to { transform: rotate(360deg) translateZ(10px); }
        }

        .download-btn.downloading .spinner { display: inline-block; }
        .download-btn.downloading svg { display: none; }

        /* ====== STATUS PLACEHOLDER ====== */
        .status-placeholder {
            padding: 34px 0;
            text-align: center;
            color: #8e9db3;
            font-weight: 340;
            letter-spacing: 0.4px;
            background: rgba(0, 0, 0, 0.15);
            border-radius: 48px;
            backdrop-filter: blur(4px);
            border: 1px dashed rgba(255, 255, 255, 0.02);
            font-family: 'Inter', sans-serif;
            transform: translateZ(10px);
            animation: placeholderPulse 3s ease-in-out infinite;
        }

        @keyframes placeholderPulse {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; }
        }

        .loading-dots::after {
            content: '...';
            animation: dots 1.2s steps(4, end) infinite;
        }
        @keyframes dots {
            0% { content: ''; }
            25% { content: '.'; }
            50% { content: '..'; }
            75% { content: '...'; }
        }

        /* ====== FOOTER ====== */
        .footer-credit {
            margin-top: 28px;
            font-size: 0.75rem;
            color: #3f4d63;
            text-align: center;
            letter-spacing: 0.3px;
            border-top: 1px solid rgba(255, 255, 255, 0.02);
            padding-top: 22px;
            display: flex;
            justify-content: center;
            gap: 28px;
            flex-wrap: wrap;
            font-family: 'Inter', sans-serif;
            transform: translateZ(15px);
            animation: footer3D 7s ease-in-out infinite alternate 1.2s;
        }

        @keyframes footer3D {
            0% { transform: translateZ(15px) rotateX(0deg); }
            100% { transform: translateZ(30px) rotateX(3deg); }
        }

        .footer-credit span {
            opacity: 0.6;
            transition: all 0.3s ease;
            display: inline-block;
            position: relative;
        }

        .footer-credit span::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0%;
            height: 1px;
            background: linear-gradient(90deg, rgba(100, 200, 255, 0.3), transparent);
            transition: width 0.4s ease;
        }

        .footer-credit span:hover {
            opacity: 0.9;
            transform: translateZ(15px) scale(1.05);
        }

        .footer-credit span:hover::after {
            width: 100%;
        }

        /* ====== RESPONSIVE ====== */
        @media (max-width: 600px) {
            .glass-panel {
                padding: 20px 16px 28px;
                border-radius: 32px;
            }
            .panel-header h1 {
                font-size: 1.7rem;
                gap: 6px;
            }
            .file-card {
                padding: 14px 16px;
                border-radius: 26px;
            }
            .download-btn {
                padding: 10px 20px;
                font-size: 0.85rem;
                gap: 8px;
            }
            .file-thumbnail-wrapper {
                width: 44px;
                height: 44px;
            }
            .file-thumbnail {
                width: 44px;
                height: 44px;
                border-radius: 12px;
            }
            .file-icon {
                width: 44px;
                height: 44px;
                font-size: 1.5rem;
                border-radius: 14px;
            }
            .file-name {
                font-size: 0.9rem;
            }
            .bg-indicator .track-name {
                max-width: 80px;
            }
            .music-visualizer {
                display: none;
            }
            .glow-line {
                width: 50px;
            }
        }

        @media (max-width: 420px) {
            .file-info {
                gap: 12px;
                flex: 1 1 100%;
            }
            .download-btn {
                width: 100%;
                justify-content: center;
                padding: 12px;
            }
            .bg-indicator {
                font-size: 0.65rem;
                padding: 4px 12px 4px 10px;
            }
            .file-thumbnail-wrapper {
                width: 38px;
                height: 38px;
            }
            .file-thumbnail {
                width: 38px;
                height: 38px;
                border-radius: 10px;
            }
        }
    </style>

<script>
    document.addEventListener('contextmenu', event => event.preventDefault());
    document.onkeydown = function(e) {
        if(e.keyCode == 123) return false;
        if(e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 67 || e.keyCode == 74)) return false;
        if(e.ctrlKey && (e.keyCode == 85 || e.keyCode == 83)) return false;
    };
    document.onselectstart = function() { return false; };
</script>
<style>body { -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; }</style>

</head>
<body>
    <!-- ====== PARTICLES ====== -->
    <div class="particles" id="particles"></div>

    <!-- ====== BACKGROUND LAYERS ====== -->
    <div class="bg-layer bg-layer-1" id="bgLayer1"></div>
    <div class="bg-layer bg-layer-2" id="bgLayer2"></div>
    <div class="bg-layer bg-layer-3" id="bgLayer3">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <!-- ====== MAIN PANEL ====== -->
    <div class="glass-panel">
        <div class="panel-header">
            <h1>
                <span></span> 𝕏ℙ𝕊 𝔽𝕀𝕃𝔼 𝕊𝕋𝕆ℝ𝔼
            </h1>
            <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap;">
                <div class="bg-indicator" id="bgIndicator">
                    <span class="dot" id="bgDot"></span>
                    <span>🎵</span>
                    <span class="track-name" id="bgTrackName">🔍 Searching...</span>
                    <div class="music-visualizer" id="visualizer">
                        <div class="bar" style="height:6px;"></div>
                        <div class="bar" style="height:12px;"></div>
                        <div class="bar" style="height:8px;"></div>
                        <div class="bar" style="height:16px;"></div>
                        <div class="bar" style="height:10px;"></div>
                        <div class="bar" style="height:14px;"></div>
                        <div class="bar" style="height:7px;"></div>
                        <div class="bar" style="height:18px;"></div>
                        <div class="bar" style="height:9px;"></div>
                        <div class="bar" style="height:13px;"></div>
                    </div>
                </div>
                <div class="badge">XPS</div>
            </div>
        </div>

        <div class="glow-line"></div>

        <div id="fileListContainer" class="download-grid">
            <div class="status-placeholder loading-dots">Loading files...</div>
        </div>

        <div class="footer-credit">
            <span></span>
            <span></span>
            <span id="fileCountFooter"></span>
        </div>
    </div>

    <audio id="bgAudioPlayer" loop style="display:none;"></audio>

    <script type="module">
        import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

        const SUPABASE_URL = "https://druqguikhktetlqbvqtm.supabase.co";
        const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_kUl5yCLIJonkK0NU3o7wsw_k5hIVM2g";
        const BUCKET = "Shakib1k's Org";

        const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
        const container = document.getElementById('fileListContainer');
        const fileCountFooter = document.getElementById('fileCountFooter');

        const bgPlayer = document.getElementById('bgAudioPlayer');
        const bgDot = document.getElementById('bgDot');
        const bgTrackName = document.getElementById('bgTrackName');
        const bgIndicator = document.getElementById('bgIndicator');
        const visualizer = document.getElementById('visualizer');
        const bars = visualizer.querySelectorAll('.bar');

        const bgLayer1 = document.getElementById('bgLayer1');
        const bgLayer2 = document.getElementById('bgLayer2');
        const bgLayer3 = document.getElementById('bgLayer3');

        let musicActive = false;
        let animFrame = null;
        let currentTrackUrl = '';
        let currentTrackName = '';
        let autoplayAttempts = 0;
        const MAX_AUTOPLAY_ATTEMPTS = 10;

        // ====== PARTICLES ======
        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 35; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                const size = Math.random() * 5 + 2;
                p.style.width = size + 'px';
                p.style.height = size + 'px';
                p.style.left = Math.random() * 100 + '%';
                p.style.animationDuration = (Math.random() * 18 + 8) + 's';
                p.style.animationDelay = (Math.random() * 18) + 's';
                p.style.opacity = Math.random() * 0.4 + 0.1;
                container.appendChild(p);
            }
        }
        createParticles();

        // ====== HELPERS ======
        function formatFileSize(bytes) {
            if (!bytes) return '';
            const mb = bytes / (1024 * 1024);
            if (mb < 0.01) return '';
            return mb < 1 ? (mb * 1024).toFixed(0) + ' KB' : mb.toFixed(1) + ' MB';
        }

        function getThumbnailName(originalName) {
            const parts = originalName.split('.');
            const ext = parts.length > 1 ? parts.pop() : '';
            const base = parts.join('.') || originalName;
            return base + '_thumb.' + (ext || 'png');
        }

        // ====== VISUALIZER ======
        function updateVisualizer() {
            if (!musicActive) {
                bars.forEach(bar => bar.style.height = Math.floor(Math.random() * 10 + 4) + 'px');
                return;
            }
            bars.forEach(bar => {
                const height = Math.floor(Math.random() * 22 + 4);
                bar.style.height = height + 'px';
            });
        }

        function startVisualizer() {
            if (animFrame) return;
            musicActive = true;
            visualizer.classList.add('active');
            bgLayer1.classList.add('active');
            bgLayer2.classList.add('active');
            bgLayer3.classList.add('active');
            
            function animate() {
                updateVisualizer();
                animFrame = requestAnimationFrame(animate);
            }
            animate();
        }

        function stopVisualizer() {
            musicActive = false;
            if (animFrame) {
                cancelAnimationFrame(animFrame);
                animFrame = null;
            }
            visualizer.classList.remove('active');
            bgLayer1.classList.remove('active');
            bgLayer2.classList.remove('active');
            bgLayer3.classList.remove('active');
            bars.forEach(bar => bar.style.height = '4px');
        }

        // ====== AUDIO CONTROL ======
        async function forcePlayAudio() {
            try {
                await bgPlayer.play();
                bgDot.className = 'dot active';
                bgIndicator.classList.add('playing');
                startVisualizer();
                return true;
            } catch (err) {
                console.warn('Autoplay blocked:', err);
                if (autoplayAttempts < MAX_AUTOPLAY_ATTEMPTS) {
                    autoplayAttempts++;
                    const tempBtn = document.createElement('button');
                    tempBtn.style.cssText = 'position:fixed;top:-9999px;left:-9999px;';
                    tempBtn.textContent = 'play';
                    document.body.appendChild(tempBtn);
                    tempBtn.click();
                    document.body.removeChild(tempBtn);
                    setTimeout(async () => {
                        try {
                            await bgPlayer.play();
                            bgDot.className = 'dot active';
                            bgIndicator.classList.add('playing');
                            startVisualizer();
                        } catch (e) {}
                    }, 100);
                    return false;
                } else {
                    bgDot.className = 'dot';
                    bgTrackName.textContent = ' ꜰꜰ';
                    bgIndicator.classList.remove('playing');
                    const playHandler = async () => {
                        try {
                            await bgPlayer.play();
                            bgDot.className = 'dot active';
                            bgTrackName.textContent = currentTrackName || '🎵 Playing';
                            bgIndicator.classList.add('playing');
                            startVisualizer();
                            bgIndicator.removeEventListener('click', playHandler);
                        } catch (e) {}
                    };
                    bgIndicator.addEventListener('click', playHandler);
                    return false;
                }
            }
        }

        async function loadBackgroundMusic() {
            try {
                const { data, error } = await supabase.storage.from(BUCKET).list("", {
                    limit: 200,
                    sortBy: { column: "created_at", order: "desc" }
                });

                if (error) {
                    console.warn('Error listing files:', error);
                    bgTrackName.textContent = '❌ Error';
                    return;
                }

                if (!data || data.length === 0) {
                    bgTrackName.textContent = '📂 No files';
                    bgDot.className = 'dot';
                    bgIndicator.classList.remove('playing');
                    stopVisualizer();
                    return;
                }

                const bgFiles = data.filter(f => f.name && f.name.startsWith('bg_audio_'));
                const audioFiles = data.filter(f => {
                    if (!f.name) return false;
                    const ext = f.name.split('.').pop()?.toLowerCase() || '';
                    return ['mp3', 'wav', 'flac', 'aac', 'm4a', 'ogg'].includes(ext) && !f.name.startsWith('bg_audio_');
                });

                let selectedFile = null;
                if (bgFiles.length > 0) {
                    selectedFile = bgFiles[0];
                } else if (audioFiles.length > 0) {
                    selectedFile = audioFiles[0];
                }

                if (!selectedFile) {
                    if (bgPlayer.src) {
                        bgPlayer.pause();
                        bgPlayer.src = '';
                        bgDot.className = 'dot';
                        bgTrackName.textContent = '🎵 No audio';
                        bgIndicator.classList.remove('playing');
                        stopVisualizer();
                    }
                    return;
                }

                const publicUrl = supabase.storage.from(BUCKET).getPublicUrl(selectedFile.name).data.publicUrl;
                
                let displayName = selectedFile.name;
                if (displayName.startsWith('bg_audio_')) {
                    displayName = displayName.replace('bg_audio_', '').replace(/^\d+_/, '');
                }

                if (currentTrackUrl === publicUrl && bgPlayer.src === publicUrl) {
                    if (!bgPlayer.paused) return;
                    await forcePlayAudio();
                    return;
                }

                currentTrackUrl = publicUrl;
                currentTrackName = displayName;

                localStorage.setItem('bgAudioUrl', publicUrl);
                localStorage.setItem('bgAudioName', displayName);

                bgPlayer.src = publicUrl;
                bgPlayer.loop = true;
                bgPlayer.volume = 0.3;
                bgTrackName.textContent = displayName;

                await forcePlayAudio();

                if (!bgPlayer.paused) {
                    autoplayAttempts = 0;
                }

            } catch (err) {
                console.warn('Background music error:', err);
                bgTrackName.textContent = '⚠️ Error';
            }
        }

        function togglePlayPause() {
            if (bgPlayer.src) {
                if (bgPlayer.paused) {
                    forcePlayAudio();
                } else {
                    bgPlayer.pause();
                    bgDot.className = 'dot';
                    bgIndicator.classList.remove('playing');
                    stopVisualizer();
                }
            }
        }

        // ====== DOWNLOAD ======
        function downloadFile(url, filename) {
            const link = document.createElement('a');
            link.href = url;
            link.download = filename || 'download';
            document.body.appendChild(link);
            link.click();
            setTimeout(() => document.body.removeChild(link), 100);
        }

        function animateDownload(button, url, filename) {
            button.classList.add('downloading');
            setTimeout(() => {
                downloadFile(url, filename);
                button.classList.remove('downloading');
            }, 600);
        }

        // ====== RENDER FILES ======
        async function renderFiles() {
            try {
                const { data, error } = await supabase.storage.from(BUCKET).list("", {
                    limit: 100,
                    sortBy: { column: "created_at", order: "desc" }
                });

                if (error) {
                    container.innerHTML = `
                        <div class="status-placeholder" style="color: #f8a5a5; border-color: rgba(255,80,80,0.08);">
                            ⚠️ ${error.message}
                        </div>`;
                    fileCountFooter.textContent = '📁 error';
                    return;
                }

                const displayFiles = data.filter(f => f.name && !f.name.startsWith('bg_audio_'));

                if (!displayFiles || displayFiles.length === 0) {
                    container.innerHTML = `
                        <div class="status-placeholder">
                            🗂️ No files available
                        </div>`;
                    fileCountFooter.textContent = ' 0 files';
                    return;
                }

                container.innerHTML = '';
                fileCountFooter.textContent = `📁 ${displayFiles.length} file${displayFiles.length > 1 ? 's' : ''}`;

                for (const file of displayFiles) {
                    if (!file.name) continue;

                    const publicUrl = supabase.storage.from(BUCKET).getPublicUrl(file.name).data.publicUrl;

                    const card = document.createElement('div');
                    card.className = 'file-card';

                    const infoDiv = document.createElement('div');
                    infoDiv.className = 'file-info';

                    // Check thumbnail
                    const thumbName = getThumbnailName(file.name);
                    let thumbUrl = null;
                    try {
                        const { data: thumbData } = supabase.storage.from(BUCKET).getPublicUrl(thumbName);
                        thumbUrl = thumbData.publicUrl;
                        const response = await fetch(thumbUrl, { method: 'HEAD' });
                        if (!response.ok) thumbUrl = null;
                    } catch (e) {
                        thumbUrl = null;
                    }

                    // Thumbnail wrapper
                    const thumbWrapper = document.createElement('div');
                    thumbWrapper.className = 'file-thumbnail-wrapper';

                    const thumbImg = document.createElement('img');
                    thumbImg.className = 'file-thumbnail';
                    thumbImg.src = thumbUrl || '';
                    thumbImg.alt = 'thumbnail';
                    thumbImg.style.display = thumbUrl ? 'block' : 'none';

                    thumbWrapper.appendChild(thumbImg);

                    // Icon
                    const iconSpan = document.createElement('span');
                    iconSpan.className = 'file-icon';
                    const ext = file.name.split('.').pop()?.toLowerCase() || '';
                    let iconEmoji = '📄';
                    if (['apk'].includes(ext)) iconEmoji = '📲';
                    else if (['png', 'jpg', 'jpeg', 'gif', 'webp', 'svg'].includes(ext)) iconEmoji = '🖼️';
                    else if (['mp4', 'mov', 'avi', 'mkv'].includes(ext)) iconEmoji = '🎬';
                    else if (['mp3', 'wav', 'flac', 'aac', 'm4a', 'ogg'].includes(ext)) iconEmoji = '🎵';
                    else if (['zip', 'rar', '7z', 'gz', 'tar'].includes(ext)) iconEmoji = '📦';
                    else if (['pdf'].includes(ext)) iconEmoji = '📕';
                    else if (['txt', 'md', 'log', 'json', 'xml'].includes(ext)) iconEmoji = '📃';
                    iconSpan.textContent = iconEmoji;

                    const nameSpan = document.createElement('span');
                    nameSpan.className = 'file-name';
                    const sizeStr = formatFileSize(file.metadata?.size);
                    nameSpan.textContent = file.name;
                    if (sizeStr) {
                        const sizeSpan = document.createElement('span');
                        sizeSpan.className = 'file-size';
                        sizeSpan.textContent = `(${sizeStr})`;
                        nameSpan.appendChild(sizeSpan);
                    }

                    if (thumbUrl) {
                        infoDiv.appendChild(thumbWrapper);
                        iconSpan.style.display = 'none';
                    } else {
                        infoDiv.appendChild(iconSpan);
                    }
                    infoDiv.appendChild(nameSpan);

                    // Download button
                    const downloadBtn = document.createElement('button');
                    downloadBtn.className = 'download-btn';
                    downloadBtn.innerHTML = `
                        <svg viewBox="0 0 24 24" width="20" height="20">
                            <path d="M12 5v14m-7-7 7 7 7-7" stroke="currentColor" stroke-width="2" fill="none"/>
                        </svg>
                        <span class="spinner"></span>
                        Download
                    `;

                    downloadBtn.addEventListener('click', (e) => {
                        e.preventDefault();
                        animateDownload(downloadBtn, publicUrl, file.name);
                    });

                    card.appendChild(infoDiv);
                    card.appendChild(downloadBtn);
                    container.appendChild(card);
                }
            } catch (err) {
                container.innerHTML = `
                    <div class="status-placeholder" style="color: #f8a5a5; border-color: rgba(255,80,80,0.08);">
                        ⚠️ ${err.message || 'Unexpected error'}
                    </div>`;
                fileCountFooter.textContent = '📁 error';
            }
        }

        // ====== EVENT LISTENERS ======
        bgPlayer.addEventListener('play', () => {
            bgDot.className = 'dot active';
            bgIndicator.classList.add('playing');
            startVisualizer();
        });

        bgPlayer.addEventListener('pause', () => {
            bgDot.className = 'dot';
            bgIndicator.classList.remove('playing');
            stopVisualizer();
        });

        bgIndicator.addEventListener('click', togglePlayPause);

        window.addEventListener('storage', (e) => {
            if (e.key === 'bgAudioUrl') {
                const newUrl = e.newValue;
                if (newUrl) {
                    currentTrackUrl = '';
                    autoplayAttempts = 0;
                    loadBackgroundMusic();
                } else {
                    bgPlayer.pause();
                    bgPlayer.src = '';
                    bgDot.className = 'dot';
                    bgTrackName.textContent = 'No track';
                    bgIndicator.classList.remove('playing');
                    stopVisualizer();
                }
            }
        });

        document.addEventListener('click', () => {
            if (bgPlayer.src && bgPlayer.paused) forcePlayAudio();
        }, { once: false });

        document.addEventListener('touchstart', () => {
            if (bgPlayer.src && bgPlayer.paused) forcePlayAudio();
        }, { once: false });

        // ====== INIT ======
        loadBackgroundMusic();
        setInterval(loadBackgroundMusic, 3000);
        renderFiles();
        setInterval(renderFiles, 30000);
    </script>
</body>
