<script>
    document.addEventListener('contextmenu', event => event.preventDefault());
    document.onkeydown = function(e) {
        if(e.keyCode == 123) return false;
        if(e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 67 || e.keyCode == 74)) return false;
        if(e.ctrlKey && (e.keyCode == 85 || e.keyCode == 83)) return false;
    };

</script>

function renderHome(){app().innerHTML=`<div class="screen"><div class="card home-card"><span class="emoji-big">🧸💗</span><span class="badge">✨ Cute Quiz Zone ✨</span><h1>চলো বাবু<br>খেলা শুরু করি</h1><p class="subtitle">দেখি তো তুমি কতটা চালাক! 😌</p><div class="home-prize"><strong>🎁 সম্পূর্ণ গেম জিতলে আকর্ষণীয় একটা পুরস্কার আছে তোমার জন্য!</strong><span>শেষ পর্যন্ত যেতে পারলেই জানতে পারবে পুরস্কারটা কী 👀</span></div><button class="main-btn" onclick="startGame()">শুরু করো ✨</button></div></div>`}
function renderStep(n){
  currentStep=n;
  const realIndex=questionOrder[n];
  const s=steps[realIndex];
  const percent=((n+1)/steps.length)*100;
  const order=optionOrders[realIndex];

  app().innerHTML=`<div class="screen"><div class="card">
    <div class="progress-wrap">
      <div class="progress-top">
        <span>STEP ${n+1}</span>
        <span>${n+1}/${steps.length}</span>
      </div>
      <div class="progress"><span style="width:${percent}%"></span></div>
    </div>
    <h2>${s.q}</h2>
    <p class="subtitle">একটা উত্তর বেছে নাও 👇</p>
    <div class="options">
      ${order.map((optionIndex,i)=>{
        const o=s.options[optionIndex];
        return `<button class="option" onclick="choose(${optionIndex})">
          <span class="num">${i+1}</span>
          <span>${o[1]}</span>
        </button>`;
      }).join("")}
    </div>
    ${n>0?`<div style="margin-top:16px"><button class="back-btn" onclick="goBackStep()">← আগের স্টেপ</button></div>`:""}
  </div></div>`;
}

function goBackStep(){
  sound("click");
  if(currentStep>0)renderStep(currentStep-1);
}

function choose(optionIndex){
  const realIndex=questionOrder[currentStep];
  const o=steps[realIndex].options[optionIndex];

  if(o[2]==="correct"){
    sound("correct");
    showCorrectPopup();
  }else{
    sound("wrong");
    lastStep=currentStep;
    renderWrong(o[3],o[4]);
  }
}

function showCorrectPopup(){const isLast=currentStep===steps.length-1;app().insertAdjacentHTML("beforeend",`<div class="popup-layer" id="correctPopup"><div class="popup"><span class="popup-icon">${isLast?"🏆":"✅"}</span><h3>সঠিক উত্তর!</h3><p>${isLast?"সবগুলো উত্তর সঠিক! তুমি সত্যিই চালাক! 🔥":"উত্তরটা ফাটাফাটি! 😎"}</p><button class="popup-btn" onclick="closeCorrectPopup()">ঠিক আছে ✨</button></div></div>`);if(isLast)createConfetti()}
function closeCorrectPopup(){sound("click");document.getElementById("correctPopup")?.remove();if(currentStep===steps.length-1)renderFinal();else renderStep(currentStep+1)}
function renderWrong(imageKey,text){app().innerHTML=`<div class="screen"><div class="card shake"><span class="emoji-big" style="font-size:4rem">😂🌚</span><h2 class="wrong-title">${text}</h2><img class="wrong-img" src="${wrongImages[imageKey]}" alt="Funny reaction"><button class="back-btn" onclick="renderStep(${lastStep})">← BACK</button><p class="small-note">আবার চেষ্টা করো বাবু 😌</p></div></div>`}
function renderFinal(){selectedRating=0;app().innerHTML=`<div class="screen"><div class="card"><span class="success-icon">🎉</span><div class="sparkles">✨ 💗 ✨</div><h1 class="final-title">তুমি জিতে গেছ! 🥳</h1><p class="subtitle">সবগুলো প্রশ্নের সঠিক উত্তর দিয়েছো! এখন তোমার পুরস্কার নেওয়ার পালা 🎁</p><div class="review-box"><div class="review-title">⭐ আগে একটা রেটিং দাও</div><div class="stars">${[1,2,3,4,5,6,7,8].map(n=>`<button class="star" id="star-${n}" onclick="setRating(${n})">★</button>`).join("")}</div><div class="rating-text" id="ratingText">কতটা ভালো লেগেছে? ১–৮ স্টার দাও 🌟</div><textarea id="review" placeholder="ওয়েবসাইটটা কেমন হয়েছে এবং গেমটা কেমন লেগেছে—এখানে লিখো... ✍️"></textarea><div class="review-hint">⚠️ রেটিং ও রিভিউ দুটোই দিতে হবে।</div><div class="error" id="reviewError"></div><button class="main-btn" onclick="submitReview()">পুরস্কার নিতে চাই 🎁</button></div></div></div>`}
function setRating(number){selectedRating=number;sound("click");for(let i=1;i<=8;i++)document.getElementById("star-"+i).classList.toggle("active",i<=number);document.getElementById("ratingText").textContent={1:"😢 একদম ভালো লাগেনি",2:"🙃 একটু ভালো লেগেছে",3:"🙂 মোটামুটি",4:"😊 ভালো",5:"😄 বেশ ভালো!",6:"😍 অনেক ভালো!",7:"🤩 দারুণ!",8:"🔥 অসাধারণ! একদম ৮/৮!"}[number]}
function submitReview(){const review=document.getElementById("review").value.trim(),error=document.getElementById("reviewError");if(!selectedRating){error.textContent="⭐ আগে অন্তত ১টা স্টার দিয়ে রেটিং দাও।";sound("wrong");return}if(review.length<3){error.textContent="✍️ আগে একটু লিখো—ওয়েবসাইট বা গেমটা কেমন হয়েছে।";sound("wrong");return}sound("correct");createConfetti();setTimeout(renderRewardPage,500)}
function renderRewardPage(){app().innerHTML=`<div class="screen"><div class="card"><span class="success-icon" style="font-size:4rem">🎁</span><h2>পুরস্কার নেওয়ার আগে একটু কাজ আছে! 👀</h2><p class="subtitle">পুরস্কার নেওয়ার আগে আমার সকল প্ল্যাটফর্ম ফলো করো ❤️</p><div class="reward-area"><div class="follow-title">🌐 আমার সকল প্ল্যাটফর্ম</div><div class="socials"><a class="social-btn youtube" href="${YOUTUBE_LINK}" target="_blank" rel="noopener noreferrer">▶️ YouTube Channel</a><a class="social-btn tiktok" href="${TIKTOK_LINK}" target="_blank" rel="noopener noreferrer">♪ TikTok</a></div><div class="follow-check">❤️ প্ল্যাটফর্মগুলো দেখে/ফলো করার পর নিচের বাটনে ক্লিক করো।</div><button class="main-btn reward-btn" onclick="openPrize()">আমি ফলো করেছি — পুরস্কার নাও 🎁</button><p class="reward-note">* এই পেজ নিজে থেকে তোমার ফলো করা যাচাই করতে পারে না।</p></div></div></div>`}
function openPrize(){sound("click");if(REWARD_LINK!=="#")window.open(REWARD_LINK,"_blank","noopener,noreferrer");setTimeout(renderPrizeMessage,250)}
function renderPrizeMessage(){app().innerHTML=`<div class="screen"><div class="card"><span class="emoji-big">😂🎁</span><h2 class="prize-text">কিরে সালা,<br>পুরস্কারের আশায় এতদূর পর্যন্ত এসেছিস? 🌚</h2><img class="prize-img" src="${prizeImage}" alt="Funny prize"><p class="subtitle">😂😂😂</p><button class="main-btn" onclick="renderHome()">আবার শুরু করি 🔄</button></div></div>`}
function createConfetti(){const old=document.querySelector(".confetti");if(old)old.remove();const box=document.createElement("div");box.className="confetti";for(let i=0;i<70;i++){const p=document.createElement("i");p.style.left=Math.random()*100+"%";p.style.setProperty("--x",(Math.random()*250-125)+"px");p.style.animationDuration=(2+Math.random()*2)+"s";p.style.animationDelay=Math.random()*.5+"s";box.appendChild(p)}document.body.appendChild(box);setTimeout(()=>box.remove(),4500)}
function startGame(){
  sound("click");
  prepareRandomQuiz();
  currentStep=0;
  lastStep=0;
  renderStep(0);
}
renderHome();
</script>
</body>
</html>
