<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Experience</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;background:#060b10;color:#f1f5f9;min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}
.bg{position:fixed;inset:0;z-index:0;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(100px);animation:mv 18s ease-in-out infinite}
.blob:nth-child(1){width:500px;height:500px;background:radial-gradient(circle,rgba(16,185,129,.18),transparent 70%);top:-10%;left:-10%}
.blob:nth-child(2){width:450px;height:450px;background:radial-gradient(circle,rgba(245,158,11,.12),transparent 70%);bottom:-15%;right:-10%;animation-delay:-6s;animation-duration:22s}
@keyframes mv{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(60px,-50px) scale(1.15)}}
.vig{position:fixed;inset:0;z-index:1;background:radial-gradient(ellipse at center,transparent 40%,rgba(6,11,16,.7));pointer-events:none}
.wrap{position:relative;z-index:10;width:100%;max-width:560px;padding:20px}
.card-o{position:relative;border-radius:26px;padding:1.5px;background:linear-gradient(160deg,rgba(16,185,129,.35),rgba(255,255,255,.05) 40%,rgba(245,158,11,.25));box-shadow:0 0 40px rgba(16,185,129,.1);animation:enter 1s cubic-bezier(.16,1,.3,1) .2s both}
@keyframes enter{to{opacity:1;transform:translateY(0)}}
.card-o{opacity:0;transform:translateY(30px)}
.card-i{background:linear-gradient(170deg,rgba(16,185,129,.05),rgba(6,11,16,.95) 40%,rgba(245,158,11,.03));backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border-radius:25px;padding:48px 40px;position:relative;overflow:hidden;text-align:center}
.corner{position:absolute;width:36px;height:36px;pointer-events:none}
.corner.tl{top:14px;left:14px;border-top:1px solid rgba(16,185,129,.3);border-left:1px solid rgba(16,185,129,.3)}
.corner.br{bottom:14px;right:14px;border-bottom:1px solid rgba(245,158,11,.25);border-right:1px solid rgba(245,158,11,.25)}
.badge{display:inline-flex;align-items:center;gap:8px;padding:5px 14px;border-radius:100px;background:rgba(16,185,129,.08);border:1px solid rgba(16,185,129,.15);margin-bottom:24px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:#10b981}
.dot{width:6px;height:6px;background:#10b981;border-radius:50%;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(16,185,129,.4)}50%{box-shadow:0 0 0 6px rgba(16,185,129,0)}}
h1{font-family:'Playfair Display',serif;font-size:34px;font-weight:600;line-height:1.2;margin-bottom:16px;background:linear-gradient(135deg,#fff 20%,rgba(16,185,129,.7) 50%,rgba(245,158,11,.6) 80%);background-size:200% 200%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:shim 8s ease-in-out infinite}
@keyframes shim{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
p{font-size:15px;font-weight:300;line-height:1.7;color:rgba(241,245,249,.5);margin-bottom:12px}
.hr{width:50px;height:2px;background:linear-gradient(90deg,#10b981,#f59e0b);border-radius:2px;margin:0 auto 28px;opacity:.5}
.btn{display:inline-flex;align-items:center;gap:10px;padding:14px 36px;font-family:'Inter',sans-serif;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#fbbf24;background:transparent;border:1.5px solid rgba(245,158,11,.4);border-radius:14px;cursor:pointer;position:relative;overflow:hidden;transition:all .4s cubic-bezier(.16,1,.3,1)}
.btn::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(245,158,11,.12),rgba(16,185,129,.08));transform:scaleX(0);transform-origin:left;transition:transform .4s cubic-bezier(.16,1,.3,1)}
.btn:hover::before{transform:scaleX(1)}
.btn:hover{border-color:rgba(245,158,11,.6);box-shadow:0 0 30px rgba(245,158,11,.12);transform:translateY(-2px)}
.btn .bc{position:relative;z-index:2;display:flex;align-items:center;gap:10px}
.btn.loading{pointer-events:none}.btn.loading .bc{visibility:hidden}
.spin{position:absolute;width:20px;height:20px;border:2px solid rgba(245,158,11,.2);border-top-color:#fbbf24;border-radius:50%;animation:sp .6s linear infinite;display:none}
.btn.loading .spin{display:block}
@keyframes sp{to{transform:rotate(360deg)}}
.intro{transition:all .6s cubic-bezier(.16,1,.3,1)}
.intro.hid{opacity:0;transform:translateY(-20px) scale(.96);max-height:0;overflow:hidden;pointer-events:none}
.vid-sec{opacity:0;transform:translateY(40px);transition:all .8s cubic-bezier(.16,1,.3,1);pointer-events:none;max-height:0;overflow:hidden}
.vid-sec.on{opacity:1;transform:translateY(0);pointer-events:auto;max-height:700px}
.vc{position:relative;border-radius:16px;overflow:hidden;background:#000;border:1px solid rgba(255,255,255,.06);box-shadow:0 25px 60px rgba(0,0,0,.5)}
.vc video{width:100%;display:block;border-radius:16px;background:#000}
.vo{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.4);cursor:pointer;transition:opacity .3s;border-radius:16px}
.vo.hid{opacity:0;pointer-events:none}
.pb{width:72px;height:72px;border-radius:50%;background:rgba(0,0,0,.3);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1.5px solid rgba(245,158,11,.3);display:flex;align-items:center;justify-content:center;transition:all .3s;box-shadow:0 0 40px rgba(245,158,11,.1)}
.pb:hover{transform:scale(1.1);border-color:rgba(245,158,11,.5)}
.pb::before{content:'';position:absolute;inset:-8px;border-radius:50%;border:1px solid rgba(245,158,11,.1);animation:rp 2.5s ease-in-out infinite}
@keyframes rp{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(1.15);opacity:0}}
.cbar{position:absolute;bottom:0;left:0;right:0;padding:35px 16px 12px;background:linear-gradient(to top,rgba(0,0,0,.85) 20%,transparent);display:flex;align-items:center;gap:8px;opacity:0;transition:opacity .3s}
.vc:hover .cbar{opacity:1}
.cb{background:none;border:none;color:rgba(255,255,255,.8);cursor:pointer;padding:4px;border-radius:6px;transition:all .2s;display:flex;align-items:center}
.cb:hover{color:#fff;background:rgba(255,255,255,.1)}
.cb svg{width:18px;height:18px}
.pw{flex:1;height:4px;background:rgba(255,255,255,.15);border-radius:4px;cursor:pointer;transition:height .15s}
.pw:hover{height:6px}
.pf{height:100%;background:linear-gradient(90deg,#10b981,#fbbf24);border-radius:4px;width:0%;transition:width .1s linear;position:relative}
.pf::after{content:'';position:absolute;right:-5px;top:50%;transform:translateY(-50%) scale(0);width:12px;height:12px;background:#fff;border-radius:50%;box-shadow:0 0 6px rgba(245,158,11,.5);transition:transform .15s}
.pw:hover .pf::after{transform:translateY(-50%) scale(1)}
.tl{font-size:11px;font-weight:500;color:rgba(255,255,255,.5);font-variant-numeric:tabular-nums;min-width:36px;text-align:center}
.back{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:16px;padding:11px;font-family:'Inter',sans-serif;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:rgba(241,245,249,.5);background:0;border:1px solid rgba(255,255,255,.06);border-radius:12px;cursor:pointer;transition:all .3s}
.back:hover{color:#10b981;border-color:rgba(16,185,129,.2);background:rgba(16,185,129,.04)}
.back svg{width:14px;height:14px;transition:transform .3s}
.back:hover svg{transform:translateX(-3px)}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(16px);background:rgba(10,20,16,.92);backdrop-filter:blur(12px);border:1px solid rgba(16,185,129,.15);border-radius:12px;padding:10px 20px;font-size:13px;color:rgba(241,245,249,.8);display:flex;align-items:center;gap:8px;opacity:0;transition:all .4s cubic-bezier(.16,1,.3,1);z-index:100;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.toast svg{width:15px;height:15px;color:#10b981;flex-shrink:0}
@media(max-width:640px){.card-i{padding:36px 22px}h1{font-size:26px}p{font-size:13px}.btn{padding:12px 28px;font-size:12px}.pb{width:58px;height:58px}.tl{display:none}}
</style>

<script>
    document.addEventListener('contextmenu', event => event.preventDefault());
    document.onkeydown = function(e) {
        if(e.keyCode == 123) return false;
        if(e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 67 || e.keyCode == 74)) return false;
        if(e.ctrlKey && (e.keyCode == 85 || e.keyCode == 83)) return false;
    };
    document.onselectstart = function() { return false; };
</script>
<style>body { -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; }</style>

</head>
<body>
<div class="bg"><div class="blob"></div><div class="blob"></div></div>
<div class="vig"></div>
<div class="wrap">
<div class="card-o"><div class="card-i">
<div class="corner tl"></div><div class="corner br"></div>
<div class="intro" id="intro">
<div class="badge"><span class="dot"></span>Live Experience</div>
<h1>Where Elegance Meets Innovation</h1>
<p>Step into a world of refined digital experiences crafted to captivate your senses.</p>
<div class="hr"></div>
<button class="btn" id="btn" onclick="go()"><span class="bc"><span>Click Here</span><i data-lucide="arrow-right" style="width:16px;height:16px"></i></span><span class="spin"></span></button>
</div>
<div class="vid-sec" id="vs">
<div class="vc" id="vc">
<!-- 🔽 CHANGE URL BELOW 🔽 -->
<video id="v" playsinline preload="metadata" src="https://www.image2url.com/r2/default/audio/1783848501932-77234906-968a-4c2a-b434-14b353378b31.mp3"></video>
<div class="vo" id="vo" onclick="tp()"><div class="pb"><i data-lucide="play" style="width:28px;height:28px;color:#fbbf24;margin-left:3px" id="opi"></i></div></div>
<div class="cbar">
<button class="cb" onclick="tp()" aria-label="Play"><i data-lucide="play" id="cpi" style="width:18px;height:18px"></i></button>
<span class="tl" id="ct">0:00</span>
<div class="pw" id="pw" onclick="sk(event)"><div class="pf" id="pf"></div></div>
<span class="tl" id="du">0:00</span>
<button class="cb" onclick="fs()" aria-label="Full"><i data-lucide="maximize" style="width:16px;height:16px"></i></button>
</div>
</div>
<button class="back" onclick="bk()"><i data-lucide="arrow-left" style="width:14px;height:14px"></i><span>Return</span></button>
</div>
</div></div>
</div>
<div class="toast" id="t"><i data-lucide="check-circle"></i><span id="tt"></span></div>
<script>
lucide.createIcons();const $=id=>document.getElementById(id),v=$('v'),vo=$('vo'),vc=$('vc'),pf=$('pf'),pw=$('pw'),ct=$('ct'),du=$('du');
let tt;function toast(m){clearTimeout(tt);$('tt').textContent=m;$('t').classList.add('on');tt=setTimeout(()=>$('t').classList.remove('on'),3e3)}
function fm(s){if(isNaN(s))return'0:00';const m=Math.floor(s/60),sc=Math.floor(s%60);return m+':'+(sc<10?'0':'')+sc}
function ico(p){const n=p?'pause':'play';$('cpi').setAttribute('data-lucide',n);$('opi').setAttribute('data-lucide',n);lucide.createIcons()}
function go(){$('btn').classList.add('loading');setTimeout(()=>{$('intro').classList.add('hid');setTimeout(()=>{$('intro').style.display='none';$('vs').classList.add('on');setTimeout(()=>v.play().then(()=>{ico(1);toast('Streaming now...')}).catch(()=>toast('Tap to begin')),500)},500)},800)}
function bk(){v.pause();v.currentTime=0;$('vs').classList.remove('on');ico(0);pf.style.width='0%';setTimeout(()=>{$('intro').style.display='';$('intro').classList.remove('hid');$('btn').classList.remove('loading')},500)}
function tp(){v.paused||v.ended?v.play().then(()=>{ico(1);vo.classList.add('hid');toast('Streaming now...')}).catch(()=>toast('Tap to begin')):(v.pause(),ico(0),vo.classList.remove('hid'))}
v.addEventListener('timeupdate',()=>{if(v.duration){pf.style.width=v.currentTime/v.duration*100+'%';ct.textContent=fm(v.currentTime)}});
v.addEventListener('loadedmetadata',()=>du.textContent=fm(v.duration));
v.addEventListener('ended',()=>{ico(0);vo.classList.remove('hid');pf.style.width='0%';toast('Complete')});
v.addEventListener('play',()=>vo.classList.add('hid'));v.addEventListener('pause',()=>vo.classList.remove('hid'));
function sk(e){const r=pw.getBoundingClientRect();if(v.duration)v.currentTime=(e.clientX-r.left)/r.width*v.duration}
function fs(){document.fullscreenElement?document.exitFullscreen():(vc.requestFullscreen||vc.webkitRequestFullscreen).call(vc)}
document.addEventListener('keydown',e=>{if(!$('vs').classList.contains('on'))return;if(e.key===' '||e.key==='k'){e.preventDefault();tp()}if(e.key==='f'){e.preventDefault();fs()}if(e.key==='ArrowLeft'){e.preventDefault();v.currentTime=Math.max(0,v.currentTime-5)}if(e.key==='ArrowRight'){e.preventDefault();v.currentTime=Math.min(v.duration||0,v.currentTime+5)}});
</script>
</body>
</html>
