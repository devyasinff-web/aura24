<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hosting Server - Login</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #333;
        }
        .container {
            background-color: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 350px;
        }
        h2 {
            text-align: center;
            color: #2d3748;
            margin-top: 0;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #4a5568;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 6px;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }
        input:focus {
            border-color: #2a5298;
            outline: none;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: #2a5298;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background-color 0.3s;
            margin-bottom: 10px;
        }
        button:hover {
            background-color: #1e3c72;
        }
        .btn-register {
            background-color: #48bb78;
        }
        .btn-register:hover {
            background-color: #38a169;
        }
        .toggle-text {
            text-align: center;
            font-size: 14px;
            color: #718096;
            cursor: pointer;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container" id="login-box">
        <h2>Login to Account</h2>
        <form action="/login" method="POST">
            <div class="form-group">
                <label>Username:</label>
                <input type="text" name="username" required>
            </div>
            <div class="form-group">
                <label>Password:</label>
                <input type="password" name="password" required>
            </div>
            <button type="submit">Login</button>
        </form>
        <div class="toggle-text" onclick="toggleMode()">New user? Create an account</div>
    </div>

    <div class="container" id="register-box" style="display: none;">
        <h2>Create Account</h2>
        <form action="/register" method="POST">
            <div class="form-group">
                <label>Choose Username:</label>
                <input type="text" name="username" required>
            </div>
            <div class="form-group">
                <label>Choose Password:</label>
                <input type="password" name="password" required>
            </div>
            <button type="submit" class="btn-register">Register Account</button>
        </form>
        <div class="toggle-text" onclick="toggleMode()">Already have an account? Login</div>
    </div>

    <script>
        function toggleMode() {
            const loginBox = document.getElementById('login-box');
            const regBox = document.getElementById('register-box');
            if (loginBox.style.display === 'none') {
                loginBox.style.display = 'block';
                regBox.style.display = 'none';
            } else {
                loginBox.style.display = 'none';
                regBox.style.display = 'block';
            }
        }
    </script>
</body>
</html>
